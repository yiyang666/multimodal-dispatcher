name: llm-stack

services:
  agent-6000ada:
    image: vllm/vllm-openai:v0.28.0
    container_name: agent-6000ada
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8101:8000"
    networks:
      - backplane
    environment:
      HF_HUB_DISABLE_XET: "1"
      # sleep/wake 开发态 API（/sleep /wake_up）需要该开关
      VLLM_SERVER_DEV_MODE: "1"
    volumes:
      - "${HOME}/.cache/huggingface:/root/.cache/huggingface"
      - "${HOME}/.cache/vllm:/root/.cache/vllm"
      - "${HOME}/models:/models"
      # WSL: 强制关闭 CuMem RDMA flag，否则 cuMemSetAccess 返回 CUDA_ERROR_UNKNOWN
      # 路径相对本仓库；若 compose 拷到 ~/llm-stack/ 运行，请同步复制 deploy/vllm-patches/
      - "./deploy/vllm-patches/cumem_allocator.abi3.so:/usr/local/lib/python3.12/dist-packages/vllm/cumem_allocator.abi3.so:ro"
    command:
      - Qwen/Qwen3.8-27B-FP8
      - --served-model-name
      - agent-6000ada
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      # RTX 6000 Ada 48GB + 0.85 实测画像预估约 155K KV tokens；128K 保留安全余量。
      - "131072"
      # 少量 Agent 并发优先保留长上下文；所有请求仍共享同一个 KV cache 池。
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.85"
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      # OpenClaw / 飞书会发 tool_choice=auto，必须显式开启工具调用
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      # 复用固定前缀，降低多轮 prefill
      - --enable-prefix-caching
      # 空闲释放显存用 sleep，避免 docker stop 后数分钟冷启动
      - --enable-sleep-mode

networks:
  backplane:
    name: llm-backplane
    external: true
